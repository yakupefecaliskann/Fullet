name: fullet_flutter
description: Fullet fuel-price map app.
publish_to: 'none'
version: 1.0.4+7

environment:
  # package_info_plus 8.x sdk >=3.3.0 istiyor; alt sınır 3.2.3'te kalırsa
  # bildirilen kısıt gerçeği yansıtmaz (pub yalnızca KURULU SDK'ya bakar,
  # temiz bir 3.2.3 ortamında çözümleme kırılırdı).
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  google_maps_flutter: ^2.5.3
  geolocator: ^11.1.0
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  firebase_core: ^2.27.0
  firebase_crashlytics: ^3.4.18
  firebase_analytics: ^10.8.9
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  package_info_plus: ^8.0.0
  # package_info_plus, win32'yi ">=4.0.0 <6.0.0" olarak serbest bırakıyor ve
  # çözümleyici 5.2.0'ı seçiyor. O sürüm `UnmodifiableUint8ListView` kullanıyor;
  # bu tip Dart 3.4'te KALDIRILDI, dolayısıyla `flutter test` derlemesi
  # kırılıyor. 5.5+ bu kullanımı temizledi — alt sınırı burada sabitliyoruz.
  win32: ^5.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - assets/map_styles/
    - .env
