name: fullet_flutter
description: Fullet fuel-price map app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  google_maps_flutter: ^2.5.3
  geolocator: ^11.1.0
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
