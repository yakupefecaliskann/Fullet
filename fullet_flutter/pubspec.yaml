name: fullet_flutter
description: Fullet fuel-price map app.
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  google_maps_flutter: ^2.5.3
  geolocator: ^11.1.0
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  firebase_core: ^2.27.0
  firebase_crashlytics: ^3.4.18
  firebase_analytics: ^10.8.9
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.2
  google_maps_cluster_manager_2: ^3.2.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - assets/map_styles/
    - .env
