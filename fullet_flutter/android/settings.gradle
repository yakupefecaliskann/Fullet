pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    // Kotlin sürümü BURADA bildirilmek zorunda: eklenti modülleri (ör.
    // google_maps_flutter_android) KGP'yi flutter-plugin-loader üzerinden
    // pluginManagement'tan çözüyor, kök build.gradle'daki buildscript
    // classpath'ini görmüyorlar. google_maps_flutter_android 2.19.x
    // kotlin-stdlib 2.3.10 ile derlenmiş; daha eski bir derleyici
    // "incompatible metadata version" ile kırılır.
    id "org.jetbrains.kotlin.android" version "2.3.10" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
    // END: FlutterFire Configuration
}

include ":app"
