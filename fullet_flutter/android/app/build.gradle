plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.fullet.app"
    compileSdkVersion 36
    // Eklentiler (google_sign_in_android, package_info_plus,
    // shared_preferences_android, url_launcher_android, path_provider_android)
    // en az NDK 27 istiyor. NDK sürümleri geriye dönük uyumlu olduğu için
    // en yükseğini sabitlemek doğru olan.
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    def mapsApiKey = localProperties.getProperty('MAPS_API_KEY')
    if (mapsApiKey == null) {
        mapsApiKey = ''
    }

    defaultConfig {
        applicationId "com.fullet.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [ MAPS_API_KEY: mapsApiKey ]
    }

    def keystorePropertiesFile = rootProject.file("key.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // L4: R8 kod küçültme + kullanılmayan kaynak temizliği. Dart kodu
            // AOT derlendiği için asıl uygulama mantığı zaten native tarafta;
            // buradaki kazanç Java/Kotlin katmanında ve paket boyutunda.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            // key.properties YOKSA signingConfigs.release boş kalıyor ve AGP,
            // üç dakikalık bir derlemenin en sonunda `:app:signReleaseBundle`
            // adımında mesajsız bir NullPointerException fırlatıyordu. Koşulu
            // buraya taşımak hatayı okunur bir uyarıya çeviriyor: paket imzasız
            // üretilir, ama bunun Play'e yüklenemeyeceği açıkça söylenir.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle(
                    "UYARI: android/key.properties bulunamadi -> release paketi IMZASIZ uretiliyor. " +
                    "Google Play bu paketi REDDEDER. Kurulum icin: GOOGLE_PLAY_LAUNCH_CHECKLIST.md ss.2.1"
                )
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
