name: Fullet Data Automation

on:
  schedule:
    # Price refreshes: 06:20, 12:20, 18:20, 00:20 Turkey time.
    - cron: "20 3,9,15,21 * * *"
    # News refreshes: 08:50 and 20:50 Turkey time.
    - cron: "50 5,17 * * *"
    # Station inventory refresh: Sunday 04:40 Turkey time.
    - cron: "40 1 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which bot group should run?"
        required: true
        default: "prices"
        type: choice
        options:
          - prices
          - stations
          - news
          - all
      dry_run:
        description: "Run without writing to Supabase"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

concurrency:
  group: fullet-data-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Resolve bot mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            DRY_RUN="${{ inputs.dry_run }}"
          elif [ "${{ github.event.schedule }}" = "20 3,9,15,21 * * *" ]; then
            MODE="prices"
            DRY_RUN="0"
          elif [ "${{ github.event.schedule }}" = "50 5,17 * * *" ]; then
            MODE="news"
            DRY_RUN="0"
          elif [ "${{ github.event.schedule }}" = "40 1 * * 0" ]; then
            MODE="stations"
            DRY_RUN="0"
          else
            MODE="prices"
            DRY_RUN="1"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE dry_run=$DRY_RUN"

      - name: Run scraper orchestrator
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FULLET_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          FULLET_ALLOW_DB_WRITE: ${{ steps.mode.outputs.dry_run == '1' && '0' || '1' }}
        run: python run_all_bots.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Backend health check
        if: always() && steps.mode.outputs.mode != 'news'
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python backend_health_check.py

      - name: Live operations report
        if: always() && steps.mode.outputs.mode != 'news'
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python ops_report.py
